[tools]
node = "lts"
java = "latest"
go = "latest"
ghq = "latest"
terraform = "latest"
starship = "latest"
neovim = "latest"
delta = "latest"
bottom = "latest"
bun = "latest"
yarn = "latest"

[settings]
idiomatic_version_file_enable_tools = ["rust", "node", "terraform"]
jobs = 4
env_file = [".env"]
experimental = true

trusted_config_paths = ["~/work", "~/hobby", "~/repos"]

[env]
CLICOLOR_FORCE = "1"
FORCE_COLOR = "1"
