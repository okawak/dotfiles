[settings]
idiomatic_version_file_enable_tools = ["rust", "node", "terraform"]
jobs = 4
env_file = [".env"]
experimental = true
trusted_config_paths = ["~/work", "~/hobby", "~/repos"]
activate_aggressive = true
minimum_release_age = "3d"
status.show_tools = true
status.show_env = true
tool_update.global_auto = true
task.output = "keep-order"

[bootstrap.services.mise-history]
builtin = "history-watch"

[env]
CLICOLOR_FORCE = "1"
FORCE_COLOR = "1"
